user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    tcp_nodelay on;

    # Rate-limit zones
    # 5 requests per minute for auth routes
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # 60 requests per minute for all other routes
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

    upstream express_backend {
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Strict rate limit for auth routes
        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway mapping for /api/*
        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/catalog/ {
            rewrite ^/api/catalog/(.*)$ /catalog/$1 break;
            limit_req zone=general_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments/ {
            rewrite ^/api/payments/(.*)$ /payments/$1 break;
            limit_req zone=general_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Looser rate limit for all other routes
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
